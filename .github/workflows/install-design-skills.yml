name: Install Design Skills

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/install-design-skills.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  install-skills:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout IceFresh repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Clone skills source
        run: |
          git clone --depth 1 https://github.com/FallenSoul033/antigravity-awesome-skills.git /tmp/antigravity-awesome-skills

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Install skills sequentially
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .agents/skills

          install_skill() {
            skill="$1"
            src="/tmp/antigravity-awesome-skills/skills/$skill"
            dst=".agents/skills/$skill"

            test -f "$src/SKILL.md"
            rm -rf "$dst"
            cp -R "$src" "$dst"

            find "$dst" -type d -name '__pycache__' -prune -exec rm -rf {} + || true
            find "$dst" -type f \( -name '*.pyc' -o -name '.DS_Store' \) -delete || true

            while IFS= read -r file; do
              sed -i 's#\.claude/skills/#.agents/skills/#g' "$file"
            done < <(grep -IlR --exclude='*.png' --exclude='*.jpg' --exclude='*.jpeg' --exclude='*.webp' --exclude='*.gif' '\.claude/skills/' "$dst" || true)

            git add "$dst"
            if git diff --cached --quiet; then
              echo "$skill already up to date"
            else
              git commit -m "chore(skills): install $skill"
            fi
          }

          install_skill ui-ux-pro-max
          install_skill frontend-design
          install_skill 3d-web-experience
          install_skill scroll-experience
          install_skill frontend-slides

          git push origin HEAD:main

      - name: Verify installed skills
        run: |
          set -euo pipefail
          for skill in ui-ux-pro-max frontend-design 3d-web-experience scroll-experience frontend-slides; do
            test -f ".agents/skills/$skill/SKILL.md"
            echo "OK: $skill"
          done
