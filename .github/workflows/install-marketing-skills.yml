name: Install Marketing Skills

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/install-marketing-skills.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  install-skills:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout IceFresh repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Clone marketing skills source
        run: |
          git clone --depth 1 https://github.com/FallenSoul033/marketingskills.git /tmp/marketingskills

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Install skills sequentially
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .agents/skills

          install_skill() {
            skill="$1"
            src="/tmp/marketingskills/skills/$skill"
            dst=".agents/skills/$skill"

            test -f "$src/SKILL.md"
            rm -rf "$dst"
            cp -R "$src" "$dst"

            find "$dst" -type d -name '__pycache__' -prune -exec rm -rf {} + || true
            find "$dst" -type f \( -name '*.pyc' -o -name '.DS_Store' \) -delete || true

            git add "$dst"
            if git diff --cached --quiet; then
              echo "$skill already up to date"
            else
              git commit -m "chore(skills): install $skill"
            fi
          }

          install_skill product-marketing
          install_skill marketing-plan
          install_skill customer-research
          install_skill competitor-profiling
          install_skill offers
          install_skill pricing
          install_skill copywriting
          install_skill sales-enablement
          install_skill prospecting
          install_skill cold-email
          install_skill seo-audit
          install_skill site-architecture
          install_skill schema
          install_skill ai-seo
          install_skill analytics
          install_skill cro
          install_skill ab-testing

          install_skill content-strategy
          install_skill social
          install_skill image
          install_skill video
          install_skill ads
          install_skill ad-creative
          install_skill co-marketing
          install_skill referrals

          install_skill programmatic-seo
          install_skill free-tools
          install_skill community-marketing
          install_skill lead-magnets
          install_skill public-relations
          install_skill influencer-marketing
          install_skill marketing-council
          install_skill marketing-ideas

          install_skill attribution
          install_skill revops
          install_skill emails
          install_skill marketing-loops
          install_skill marketing-psychology
          install_skill launch
          install_skill copy-editing
          install_skill competitors

          install_skill popups
          install_skill signup
          install_skill sms

          git push origin HEAD:main

      - name: Verify installed skills
        shell: bash
        run: |
          set -euo pipefail
          for skill in \
            product-marketing \
            marketing-plan \
            customer-research \
            competitor-profiling \
            offers \
            pricing \
            copywriting \
            sales-enablement \
            prospecting \
            cold-email \
            seo-audit \
            site-architecture \
            schema \
            ai-seo \
            analytics \
            cro \
            ab-testing \
            content-strategy \
            social \
            image \
            video \
            ads \
            ad-creative \
            co-marketing \
            referrals \
            programmatic-seo \
            free-tools \
            community-marketing \
            lead-magnets \
            public-relations \
            influencer-marketing \
            marketing-council \
            marketing-ideas \
            attribution \
            revops \
            emails \
            marketing-loops \
            marketing-psychology \
            launch \
            copy-editing \
            competitors \
            popups \
            signup \
            sms; do
            test -f ".agents/skills/$skill/SKILL.md"
            echo "OK: $skill"
          done
