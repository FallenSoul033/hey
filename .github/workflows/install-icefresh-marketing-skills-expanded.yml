name: Install IceFresh marketing skills expanded

on:
  push:
    paths:
      - '.github/workflows/install-icefresh-marketing-skills-expanded.yml'

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout IceFresh repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install missing marketing skills one by one
        shell: bash
        run: |
          set -euo pipefail
          SOURCE_COMMIT='3df87f97621e18fbed7f6aa684edba54f49779a7'
          git clone --quiet https://github.com/FallenSoul033/marketingskills.git /tmp/marketingskills
          git -C /tmp/marketingskills checkout --quiet "$SOURCE_COMMIT"

          git config user.name 'icefresh-marketing-installer'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          skills=(
            offers
            pricing
            sales-enablement
            prospecting
            cold-email
            site-architecture
            schema
            cro
            ab-testing
            co-marketing
            referrals
          )

          for skill in "${skills[@]}"; do
            src="/tmp/marketingskills/skills/$skill"
            dst=".codex/skills/$skill"
            test -d "$src"
            rm -rf "$dst"
            mkdir -p .codex/skills
            cp -a "$src" "$dst"
            git add "$dst"
            if ! git diff --cached --quiet; then
              git commit -m "Install marketing skill: $skill"
            fi
          done

          git push origin HEAD:main

      - name: Remove temporary installer
        shell: bash
        run: |
          set -euo pipefail
          git pull --ff-only origin main
          git rm .github/workflows/install-icefresh-marketing-skills-expanded.yml
          git commit -m 'Remove temporary expanded marketing skill installer'
          git push origin HEAD:main
