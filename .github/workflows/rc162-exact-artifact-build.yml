name: RC1.6.2 Exact Artifact Build Gate

on:
  push:
    branches:
      - ci/rc162-exact-artifact-build-gate
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  exact-artifact-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      EXPECTED_FILENAME: IceFresh_RC1_6_2_1_Canonical_QA.zip
      EXPECTED_SIZE: "2184261"
      EXPECTED_SHA256: 448a0935bf7e6e78c8d508dc2ac6cbf5d3f5647169061846ee1b104cbd3969e3
      CARRIER_FILE_ID: 1eIYQx9qorRQ50mbNPi_L28HXpHMCL4WK
      CARRIER_SHA256: 5cf0db583749210e0000f8111c9493780dc714ea1cf062b7b9b94b940df3a02a
      KEY_ENDPOINT: https://mzxhrbwwfnvpejnbhrfx.supabase.co/functions/v1/rc162-artifact-key
      VITE_SUPABASE_URL: https://example.supabase.co
      VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_placeholder

    steps:
      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Deno 2
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Fetch encrypted carrier
        shell: bash
        run: |
          set -euo pipefail
          carrier="$RUNNER_TEMP/rc1621.enc"
          url="https://drive.usercontent.google.com/download?id=${CARRIER_FILE_ID}&export=download&confirm=t"
          curl --fail --location --silent --show-error --retry 3 --retry-delay 2 -H 'User-Agent: Mozilla/5.0' "$url" -o "$carrier"
          actual_sha="$(sha256sum "$carrier" | awk '{print $1}')"
          echo "encrypted carrier sha256=$actual_sha"
          [[ "$actual_sha" == "$CARRIER_SHA256" ]] || { echo 'STOP: carrier mismatch'; exit 20; }

      - name: Obtain decryption key via GitHub Actions OIDC
        id: transport_key
        shell: bash
        run: |
          set -euo pipefail
          oidc_json="$(curl --fail --silent --show-error -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=icefresh-rc162-build")"
          oidc_token="$(printf '%s' "$oidc_json" | jq -r '.value')"
          key_json="$(curl --fail --silent --show-error -X POST -H "Authorization: Bearer ${oidc_token}" "$KEY_ENDPOINT")"
          transport_key="$(printf '%s' "$key_json" | jq -r '.key')"
          meta_name="$(printf '%s' "$key_json" | jq -r '.expected_filename')"
          meta_size="$(printf '%s' "$key_json" | jq -r '.expected_size')"
          meta_sha="$(printf '%s' "$key_json" | jq -r '.expected_sha256')"
          [[ "$meta_name" == "$EXPECTED_FILENAME" && "$meta_size" == "$EXPECTED_SIZE" && "$meta_sha" == "$EXPECTED_SHA256" ]] || { echo 'STOP: OIDC metadata mismatch'; exit 22; }
          echo "::add-mask::$transport_key"
          echo "key=$transport_key" >> "$GITHUB_OUTPUT"

      - name: Decrypt exact candidate bytes
        shell: bash
        env:
          RC162_TRANSPORT_KEY: ${{ steps.transport_key.outputs.key }}
        run: |
          set -euo pipefail
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -md sha256 -in "$RUNNER_TEMP/rc1621.enc" -out "$RUNNER_TEMP/$EXPECTED_FILENAME" -pass env:RC162_TRANSPORT_KEY

      - name: Exact ZIP identity gate
        shell: bash
        run: |
          set -euo pipefail
          artifact="$RUNNER_TEMP/$EXPECTED_FILENAME"
          actual_size="$(stat -c '%s' "$artifact")"
          actual_sha="$(sha256sum "$artifact" | awk '{print $1}')"
          echo "filename=$EXPECTED_FILENAME"
          echo "byte size=$actual_size"
          echo "SHA-256=$actual_sha"
          [[ "$actual_size" == "$EXPECTED_SIZE" ]] || { echo 'STOP: byte-size mismatch'; exit 30; }
          [[ "$actual_sha" == "$EXPECTED_SHA256" ]] || { echo 'STOP: SHA-256 mismatch'; exit 31; }
          echo 'EXACT ARTIFACT IDENTITY: PASS'

      - name: Extract exact ZIP only after identity PASS
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/exact-candidate"
          unzip -q "$RUNNER_TEMP/$EXPECTED_FILENAME" -d "$RUNNER_TEMP/exact-candidate"

      - name: npm ci
        working-directory: ${{ runner.temp }}/exact-candidate
        run: npm ci --no-audit --no-fund

      - name: Lint exact candidate
        working-directory: ${{ runner.temp }}/exact-candidate
        run: npm run lint

      - name: Full project typecheck
        working-directory: ${{ runner.temp }}/exact-candidate
        run: npm run typecheck

      - name: Build exact candidate
        working-directory: ${{ runner.temp }}/exact-candidate
        env:
          VITE_SUPABASE_URL: ${{ env.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ env.VITE_SUPABASE_PUBLISHABLE_KEY }}
        run: npm run build

      - name: Run every test file including build-dependent tests
        working-directory: ${{ runner.temp }}/exact-candidate
        run: node --test tests/*.test.mjs

      - name: Built-preview HTTP smoke
        working-directory: ${{ runner.temp }}/exact-candidate
        shell: bash
        run: |
          set -euo pipefail
          log="$RUNNER_TEMP/rc1621-built-preview.log"
          npm run preview:built >"$log" 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error http://127.0.0.1:8787/ -o "$RUNNER_TEMP/rc1621-smoke.html" 2>/dev/null; then
              bytes="$(stat -c '%s' "$RUNNER_TEMP/rc1621-smoke.html")"
              echo "built-preview smoke response bytes=$bytes"
              test "$bytes" -gt 0
              ! grep -Eiq 'Server error|TypeError:|Unhandled' "$log"
              exit 0
            fi
            sleep 1
          done
          cat "$log"
          exit 41

      - name: Exact artifact gate summary
        run: echo 'EXACT ARTIFACT BUILD GATE: PASS'
