name: IceFresh CI

on:
  pull_request_target:
    types: [opened, reopened, ready_for_review]

permissions:
  contents: read
  id-token: write
  pull-requests: write
  issues: write

jobs:
  exact-artifact-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      EXPECTED_FILENAME: IceFresh_RC1_6_2_1_Canonical_QA.zip
      EXPECTED_SIZE: "2184261"
      EXPECTED_SHA256: 448a0935bf7e6e78c8d508dc2ac6cbf5d3f5647169061846ee1b104cbd3969e3
      CARRIER_FILE_ID: 1eIYQx9qorRQ50mbNPi_L28HXpHMCL4WK
      CARRIER_SHA256: 5cf0db583749210e0000f8111c9493780dc714ea1cf062b7b9b94b940df3a02a
      KEY_ENDPOINT: https://mzxhrbwwfnvpejnbhrfx.supabase.co/functions/v1/rc162-artifact-key
      VITE_SUPABASE_URL: https://example.supabase.co
      VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_placeholder
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Fetch encrypted carrier
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error --retry 3 --retry-delay 2 -H 'User-Agent: Mozilla/5.0' "https://drive.usercontent.google.com/download?id=${CARRIER_FILE_ID}&export=download&confirm=t" -o "$RUNNER_TEMP/candidate.enc"
          actual_carrier_sha="$(sha256sum "$RUNNER_TEMP/candidate.enc" | awk '{print $1}')"
          echo "encrypted carrier SHA-256=$actual_carrier_sha"
          test "$actual_carrier_sha" = "$CARRIER_SHA256"
      - name: Obtain decryption key via GitHub Actions OIDC
        id: transport_key
        shell: bash
        run: |
          set -euo pipefail
          oidc_json="$(curl --fail --silent --show-error -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=icefresh-rc162-build")"
          oidc_token="$(printf '%s' "$oidc_json" | jq -r '.value')"
          key_json="$(curl --fail --silent --show-error -X POST -H "Authorization: Bearer ${oidc_token}" "$KEY_ENDPOINT")"
          key="$(printf '%s' "$key_json" | jq -r '.key')"
          test "$(printf '%s' "$key_json" | jq -r '.expected_filename')" = "$EXPECTED_FILENAME"
          test "$(printf '%s' "$key_json" | jq -r '.expected_size')" = "$EXPECTED_SIZE"
          test "$(printf '%s' "$key_json" | jq -r '.expected_sha256')" = "$EXPECTED_SHA256"
          echo "::add-mask::$key"
          echo "key=$key" >> "$GITHUB_OUTPUT"
      - name: Decrypt exact candidate bytes
        env:
          RC162_TRANSPORT_KEY: ${{ steps.transport_key.outputs.key }}
        run: openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -md sha256 -in "$RUNNER_TEMP/candidate.enc" -out "$RUNNER_TEMP/$EXPECTED_FILENAME" -pass env:RC162_TRANSPORT_KEY
      - name: Exact ZIP identity gate
        shell: bash
        run: |
          set -euo pipefail
          actual_size="$(stat -c '%s' "$RUNNER_TEMP/$EXPECTED_FILENAME")"
          actual_sha="$(sha256sum "$RUNNER_TEMP/$EXPECTED_FILENAME" | awk '{print $1}')"
          echo "filename=$EXPECTED_FILENAME"
          echo "byte size=$actual_size"
          echo "SHA-256=$actual_sha"
          test "$actual_size" = "$EXPECTED_SIZE"
          test "$actual_sha" = "$EXPECTED_SHA256"
          echo 'EXACT ARTIFACT IDENTITY: PASS'
      - name: Extract exact candidate only after identity PASS
        run: mkdir -p "$RUNNER_TEMP/exact-candidate" && unzip -q "$RUNNER_TEMP/$EXPECTED_FILENAME" -d "$RUNNER_TEMP/exact-candidate"
      - name: npm ci
        working-directory: ${{ runner.temp }}/exact-candidate
        run: npm ci --no-audit --no-fund
      - name: Lint
        working-directory: ${{ runner.temp }}/exact-candidate
        run: npm run lint
      - name: Full typecheck
        working-directory: ${{ runner.temp }}/exact-candidate
        run: npm run typecheck
      - name: Build
        working-directory: ${{ runner.temp }}/exact-candidate
        env:
          VITE_SUPABASE_URL: ${{ env.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ env.VITE_SUPABASE_PUBLISHABLE_KEY }}
        run: npm run build
      - name: Full tests
        id: tests
        working-directory: ${{ runner.temp }}/exact-candidate
        shell: bash
        run: |
          set -euo pipefail
          node --test tests/*.test.mjs | tee "$RUNNER_TEMP/tests.log"
          total="$(awk '$1=="#" && $2=="tests"{print $3}' "$RUNNER_TEMP/tests.log" | tail -1)"
          passed="$(awk '$1=="#" && $2=="pass"{print $3}' "$RUNNER_TEMP/tests.log" | tail -1)"
          failed="$(awk '$1=="#" && $2=="fail"{print $3}' "$RUNNER_TEMP/tests.log" | tail -1)"
          test -n "$total" && test -n "$passed" && test -n "$failed"
          test "$failed" = "0"
          echo "total=$total" >> "$GITHUB_OUTPUT"
          echo "passed=$passed" >> "$GITHUB_OUTPUT"
          echo "failed=$failed" >> "$GITHUB_OUTPUT"
      - name: Built-preview smoke
        working-directory: ${{ runner.temp }}/exact-candidate
        shell: bash
        run: |
          set -euo pipefail
          npm run preview:built >"$RUNNER_TEMP/preview.log" 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8787/ -o "$RUNNER_TEMP/smoke.html"; then
              bytes="$(stat -c '%s' "$RUNNER_TEMP/smoke.html")"
              test "$bytes" -gt 0
              ! grep -Eiq 'Server error|TypeError:|Unhandled' "$RUNNER_TEMP/preview.log"
              echo "built-preview smoke response bytes=$bytes"
              exit 0
            fi
            sleep 1
          done
          cat "$RUNNER_TEMP/preview.log"
          exit 1
      - name: Publish final gate evidence
        env:
          GH_TOKEN: ${{ github.token }}
          TESTS_TOTAL: ${{ steps.tests.outputs.total }}
          TESTS_PASSED: ${{ steps.tests.outputs.passed }}
          TESTS_FAILED: ${{ steps.tests.outputs.failed }}
        shell: bash
        run: |
          gh pr comment "${{ github.event.pull_request.number }}" --repo FallenSoul033/hey --body "RC1.6.2.1 exact-artifact gate PASS

- run_id: $GITHUB_RUN_ID
- filename: $EXPECTED_FILENAME
- byte size: $EXPECTED_SIZE
- SHA-256: $EXPECTED_SHA256
- exact identity: PASS before extraction
- npm ci: PASS
- lint: PASS
- full typecheck: PASS
- build: PASS
- tests: PASS — ${TESTS_PASSED}/${TESTS_TOTAL}, failed ${TESTS_FAILED}
- built-preview smoke: PASS
- production deployment: NOT PERFORMED"
      - name: Gate summary
        run: echo 'EXACT ARTIFACT BUILD GATE: PASS'
